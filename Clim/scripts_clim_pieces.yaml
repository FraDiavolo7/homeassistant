# Scripts de raccourci pour les 4 clims (appellent demarrer_clim_midea / arreter_clim_midea).
# Vérifiez les noms d'entités (climate.*, switch.*) pour chaque pièce.

demarrer_clim_salon_chauffe_22:
  alias: Clim salon - chauffage 22 °C
  icon: mdi:radiator
  mode: single
  sequence:
    - action: script.demarrer_clim_midea
      data:
        clim: climate.salon_clim_salon
        temperature: 22
        mode_hvac: heat
        mode_ventilateur: auto
        oscillation: "off"
        preset: ""
        affichage: false
        entite_affichage: switch.salon_clim_salon_screen_display
        bip: false
        entite_bip: switch.salon_clim_salon_prompt_tone

demarrer_clim_salon_froid_25:
  alias: Clim salon - froid 25 °C
  icon: mdi:snowflake
  mode: single
  sequence:
    - action: script.demarrer_clim_midea
      data:
        clim: climate.salon_clim_salon
        temperature: 25
        mode_hvac: cool
        mode_ventilateur: auto
        oscillation: "off"
        preset: ""
        affichage: false
        entite_affichage: switch.salon_clim_salon_screen_display
        bip: false
        entite_bip: switch.salon_clim_salon_prompt_tone

arreter_clim_salon:
  alias: Arrêter la clim salon
  icon: mdi:air-conditioner
  mode: single
  sequence:
    - action: script.arreter_clim_midea
      data:
        clim: climate.salon_clim_salon

