# Une automatisation par clim, basée sur le blueprint clim_midea_auto.
# À ajouter dans automations.yaml. Adaptez les capteurs de température.

- alias: Clim salon - automatique
  use_blueprint:
    path: maison/clim_midea_auto.yaml
    input:
      clim: climate.salon_clim_salon
      temp_interieure: sensor.salon_temperature
      ext_froid: binary_sensor.exterieur_froid
      ext_chaud: binary_sensor.exterieur_chaud
      script_chauffe: script.demarrer_clim_salon_chauffe_22
      script_froid: script.demarrer_clim_salon_froid_25
      script_stop: script.arreter_clim_salon

